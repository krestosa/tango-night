<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Menú Tango · Cuarta ronda de prototipos</title>
<style>
@font-face{font-family:Inter;src:url("../assets/fonts/inter-latin-variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#0a0a0a;--ink:#f4f4f3;--muted:#c5c7c9;--blue:#0d66ee;--surface:#191b1e;--pad:clamp(20px,4.8vw,85px);font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);min-width:320px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
[hidden]{display:none!important}
img{display:block;width:100%;height:100%;object-fit:cover}
figure{margin:0}
.mast{padding:29px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:90px}
.mast__brand{font-size:18px;font-weight:800;letter-spacing:-.065em}
.mast__label{font-size:13px;color:var(--muted)}
.stage{min-height:84svh}
.section-pad{padding:clamp(85px,10vw,165px) var(--pad) clamp(145px,12vw,200px);background:var(--bg)}
.display{font-weight:790;font-size:clamp(68px,10.5vw,165px);line-height:.87;letter-spacing:-.088em;margin:0}
.display--small{font-size:clamp(62px,7.7vw,115px)}
.lead{font-size:clamp(17px,1.7vw,23px);line-height:1.45;max-width:42ch;color:#e6e7e8;margin:0}
.price{font-weight:760;letter-spacing:-.07em;line-height:1;font-size:clamp(55px,7vw,105px);margin:0}
.price-label{font-size:13px;font-weight:650;color:var(--muted);line-height:1.5}
.note{font-size:13px;line-height:1.55;color:var(--muted);max-width:70ch}
.course-title{font-weight:760;font-size:clamp(33px,3.7vw,61px);letter-spacing:-.067em;line-height:1.08;margin:0}
.choice{font-size:13px;font-weight:650;color:#d5d7da}
.dish{font-size:clamp(17px,1.5vw,22px);line-height:1.5;margin:0}
.dish small{display:inline-block;margin-left:10px;font-size:14px;color:#b7bbc0}
.continuation{padding:50px var(--pad) 130px;color:#bec0c2;font-size:14px}
.continuation strong{color:#fff;font-weight:700}
.proto-container{max-width:1620px;margin-inline:auto}
/* Fourth round: gastronomic receipt, large posters, vertical chapter navigator. */
.comanda .cm-intro{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:clamp(54px,7vw,108px)}
.comanda .cm-intro .display{font-size:clamp(70px,9vw,145px)}
.comanda .cm-intro .lead{max-width:25ch;text-align:right}
.comanda .cm-sheet{width:min(920px,100%);margin:0 auto;background:#1b1c1f}
.comanda .cm-sheet-top{padding:clamp(30px,5vw,78px);background:#25272b;display:flex;align-items:start;justify-content:space-between;gap:30px}
.comanda .cm-sheet-top strong{display:block;font-size:clamp(31px,4vw,64px);letter-spacing:-.075em;line-height:1;font-weight:800}
.comanda .cm-sheet-top p{font-size:14px;color:#d3d4d5;line-height:1.45;margin:16px 0 0}
.comanda .cm-sheet-top .cm-local{text-align:right;font-size:15px;font-weight:650;line-height:1.4;color:#f7f7f7}
.comanda .cm-item{padding:clamp(27px,3.2vw,53px) clamp(30px,5vw,78px);display:grid;grid-template-columns:minmax(150px,3.3fr) minmax(0,6.7fr);gap:clamp(25px,4vw,55px)}
.comanda .cm-item:nth-of-type(odd){background:#202124}
.comanda .cm-item:nth-of-type(even){background:#191a1d}
.comanda .cm-item h2{margin:0;font-size:clamp(28px,3.3vw,52px);letter-spacing:-.065em;line-height:1.1;font-weight:740}
.comanda .cm-item__body{display:grid;gap:16px}
.comanda .cm-item__body .choice{font-size:14px}
.comanda .cm-item__body .dish{font-size:clamp(16px,1.35vw,21px)}
.comanda .cm-sheet-total{background:#0d66ee;color:#fff;padding:clamp(30px,4vw,62px) clamp(30px,5vw,78px);display:flex;justify-content:space-between;align-items:end;gap:26px}
.comanda .cm-sheet-total span{font-size:17px;font-weight:650;line-height:1.4}
.comanda .cm-sheet-total .price{font-size:clamp(59px,6vw,96px);white-space:nowrap}
.comanda .cm-disclaimer{width:min(920px,100%);margin:36px auto 0}
/* Afiches: five bold, independent graphic compositions under a photo marquee. */
.afiches{padding-top:95px}
.afiches .af-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:35px;margin-bottom:clamp(48px,6vw,80px)}
.afiches .af-head h1{font-size:clamp(73px,9.7vw,151px)}
.afiches .af-head-price{text-align:right}
.afiches .af-head-price .price{font-size:clamp(53px,5.7vw,86px)}
.afiches .af-head-price .price-label{display:block;margin-top:14px}
.afiches .af-photo{width:100%;height:clamp(280px,47svh,620px);background:#16181a;overflow:hidden;position:relative}
.afiches .af-photo img{object-position:center 47%}
.afiches .af-photo figcaption{position:absolute;bottom:24px;left:24px;padding:12px 18px;background:#0a0a0a;color:#fff;font-weight:630;font-size:15px}
.afiches .af-lead{margin:26px 0 clamp(55px,7vw,110px)}
.afiches .af-posters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.7vw,28px)}
.afiches .af-poster{padding:clamp(34px,4vw,76px);min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(50px,6vw,105px);min-height:clamp(430px,46vw,630px);background:#1c1e21}
.afiches .af-poster:nth-child(2),.afiches .af-poster:nth-child(5){background:#242629}
.afiches .af-poster:nth-child(3){grid-column:1/-1;background:#16181a;min-height:440px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);align-items:end;gap:50px}
.afiches .af-poster h2{font-size:clamp(60px,7.2vw,118px);line-height:.93;letter-spacing:-.084em;font-weight:790;margin:0;overflow-wrap:normal}
.afiches .af-poster:nth-child(3) h2{font-size:clamp(76px,10vw,165px)}
.afiches .af-poster .choice{display:block;margin-top:18px;font-size:14px}
.afiches .af-dishes{display:grid;gap:15px;max-width:44ch}
.afiches .af-dishes .dish{font-size:clamp(17px,1.45vw,23px);line-height:1.42}
.afiches .af-note{margin-top:65px}
/* Recorrido: scrollspy navigation of all five real, fully visible courses. */
.recorrido .rc-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:35px;margin-bottom:clamp(75px,9vw,140px)}
.recorrido .rc-intro h1{font-size:clamp(72px,9.4vw,148px)}
.recorrido .rc-price{text-align:right}
.recorrido .rc-price .price{font-size:clamp(57px,6vw,96px)}
.recorrido .rc-price .price-label{display:block;margin-top:15px}
.recorrido .rc-layout{display:grid;grid-template-columns:minmax(240px,3.5fr) minmax(0,6.5fr);gap:clamp(50px,7vw,140px);align-items:stretch}
.recorrido .rc-sidebar{min-width:0}
.recorrido .rc-sticky{position:sticky;top:28px}
.recorrido .rc-links{display:grid;gap:7px}
.recorrido .rc-links a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 23px;background:#191b1e;color:#e6e7e8;font-size:clamp(19px,2.2vw,28px);font-weight:690;letter-spacing:-.045em;text-decoration:none}
.recorrido .rc-links a:hover{background:#27292c}
.recorrido .rc-links a[aria-current=location]{background:#0d66ee;color:#fff}
.recorrido .rc-links a span:last-child{font-size:17px;font-weight:540}
.recorrido .rc-sticky .lead{font-size:17px;margin-top:32px}
.recorrido .rc-body{min-width:0}
.recorrido .rc-course{min-height:clamp(480px,70svh,810px);padding:clamp(40px,5vw,80px) 0 clamp(60px,6vw,100px);scroll-margin-top:45px}
.recorrido .rc-course:not(:last-child){margin-bottom:35px}
.recorrido .rc-course h2{font-size:clamp(59px,7.2vw,110px);letter-spacing:-.081em;line-height:.97;font-weight:790;margin:0}
.recorrido .rc-course .choice{font-size:15px;display:block;margin-top:28px}
.recorrido .rc-dishes{display:grid;gap:clamp(19px,2.6vw,36px);margin-top:clamp(70px,8vw,140px);max-width:680px}
.recorrido .rc-dishes .dish{font-size:clamp(21px,2.3vw,33px);line-height:1.4}
.recorrido .rc-dishes .dish small{font-size:15px}
.recorrido .rc-note{margin-top:30px}
@media(max-width:1050px){
 .comanda .cm-intro,.afiches .af-head,.recorrido .rc-intro{align-items:start}
 .afiches .af-poster h2{font-size:clamp(49px,6vw,83px)}
 .recorrido .rc-layout{grid-template-columns:minmax(185px,3fr) minmax(0,7fr);gap:35px}
 .recorrido .rc-links a{font-size:20px;padding:15px}
}
@media(max-width:760px){
 .comanda .cm-intro,.afiches .af-head,.recorrido .rc-intro{display:block;margin-bottom:62px}
 .comanda .cm-intro .display,.afiches .af-head h1,.recorrido .rc-intro h1{font-size:clamp(64px,14.5vw,108px)}
 .comanda .cm-intro .lead{text-align:left;margin-top:25px}
 .comanda .cm-sheet-top{padding:29px 25px}
 .comanda .cm-sheet-top .cm-local{font-size:13px}
 .comanda .cm-item{grid-template-columns:1fr;gap:21px;padding:33px 26px}
 .comanda .cm-item h2{font-size:39px}
 .comanda .cm-sheet-total{padding:32px 24px;align-items:start;flex-direction:column}
 .comanda .cm-sheet-total .price{font-size:65px}
 .afiches .af-head-price,.recorrido .rc-price{text-align:left;margin-top:40px}
 .afiches .af-photo{height:37svh;min-height:260px}
 .afiches .af-posters{grid-template-columns:1fr}
 .afiches .af-poster{min-height:380px;padding:34px 28px;gap:55px}
 .afiches .af-poster:nth-child(3){display:flex;grid-column:1;min-height:420px}
 .afiches .af-poster h2,.afiches .af-poster:nth-child(3) h2{font-size:clamp(60px,12vw,94px)}
 .recorrido .rc-layout{grid-template-columns:1fr;gap:46px}
 .recorrido .rc-sidebar{align-self:start}
 .recorrido .rc-sticky{position:sticky;top:0;background:#0a0a0a;padding:12px 0;z-index:3}
 .recorrido .rc-links{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
 .recorrido .rc-links a{font-size:15px;flex:0 0 auto;padding:12px 15px;min-height:45px}
 .recorrido .rc-links a span:last-child{display:none}
 .recorrido .rc-sticky .lead{display:none}
 .recorrido .rc-course{min-height:480px;padding:60px 0 80px;scroll-margin-top:105px}
 .recorrido .rc-course h2{font-size:clamp(60px,12vw,90px)}
 .recorrido .rc-dishes{margin-top:70px}
 .recorrido .rc-dishes .dish{font-size:23px}
}
@media(max-width:410px){
 .comanda .cm-sheet-top strong{font-size:32px}
 .comanda .cm-sheet-top{gap:15px}
 .comanda .cm-sheet-total .price{font-size:clamp(48px,13.5vw,63px)}
 .afiches .af-poster h2,.afiches .af-poster:nth-child(3) h2{font-size:clamp(50px,12vw,69px)}
 .recorrido .rc-course h2{font-size:clamp(48px,12vw,68px)}
 .recorrido .rc-links{gap:3px;justify-content:space-between}
 .recorrido .rc-links a{font-size:13px;padding:11px 7px;justify-content:center;white-space:nowrap}
}
/* Picker: unchanged Emil Kowalski prototype harness chrome. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: /* taste-skill-ignore: Emil's mandatory picker chrome, not part of the menu design */
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<header class="mast">
  <span class="mast__brand">SUSHICLUB <span style="font-weight:450">/ NOCHE DE TANGO</span></span>
  <span class="mast__label">MENÚ TANGO · RONDA 4</span>
</header>
<main id="stage" class="stage" aria-live="polite"></main>
<footer class="continuation"><div class="proto-container">La experiencia continúa con <strong>reservas anticipadas</strong> en los salones adheridos.</div></footer>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Comanda</button>
  <button class="proto-picker-item">Afiches</button>
  <button class="proto-picker-item">Recorrido</button>
</nav>
<script>

const courses = [
  {name:"Appetizer",choice:"",items:[["Appetizer del día",""]]},
  {name:"Entrada",choice:"A elección",items:[["Pink Floyd","3 unidades"],["Dupla Arrolladito Vegan","2 unidades"]]},
  {name:"Principal",choice:"A elección",items:[["Wok Langostinos",""],["Sorrentinos Back",""],["Roll&Roll","15 piezas"],["Bio Veggie","15 piezas"]]},
  {name:"Postre",choice:"",items:[["Flan de chocolate blanco",""]]},
  {name:"Bebidas",choice:"",items:[["Copa de vino Trapiche Malbec o Chardonnay, o gaseosa.",""],["Más agua con o sin gas, agua saborizada o gaseosa.",""]]}
];
const note = "ENTRADA Y PRINCIPAL A ELECCIÓN POR PERSONA. LA DISPONIBILIDAD DE LOS PRODUCTOS ESTÁ SUJETA AL LOCAL ADHERIDO.";
function escapeHTML(str){return str.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function itemsHTML(course){return course.items.map(([name,amount]) =>
  '<p class="dish">'+escapeHTML(name)+(amount?' <small>'+escapeHTML(amount)+'</small>':'')+'</p>'
).join('');}

function comanda(){
 const parts=courses.map(c=>'<article class="cm-item">'+
  '<h2>'+escapeHTML(c.name)+'</h2><div class="cm-item__body">'+
  (c.choice?'<span class="choice">'+escapeHTML(c.choice)+'</span>':'')+
  itemsHTML(c)+'</div></article>').join('');
 return `
 <section class="section-pad comanda" aria-labelledby="cm-title"><div class="proto-container">
  <div class="cm-intro"><h1 class="display" id="cm-title">MENÚ<br>TANGO</h1>
  <p class="lead">Todo lo que incluye tu noche, en una sola comanda.</p></div>
  <div class="cm-sheet">
    <div class="cm-sheet-top">
      <div><strong>Noche de Tango.</strong><p>Propuesta gastronómica SushiClub</p></div>
      <span class="cm-local">CABA Y GBA<br>TURNO NOCHE<br>CON RESERVA PREVIA</span>
    </div>
    ${parts}
    <div class="cm-sheet-total"><span>Menú por persona</span><p class="price">$79.000</p></div>
  </div>
  <p class="note cm-disclaimer">${note}</p>
 </div></section>`;
}
function afiches(){
 const parts=courses.map((c,i)=>'<article class="af-poster">'+
   '<div><h2>'+escapeHTML(c.name)+'</h2>'+
   (c.choice?'<span class="choice">'+escapeHTML(c.choice)+'</span>':'')+'</div>'+
   '<div class="af-dishes">'+itemsHTML(c)+'</div></article>').join('');
 return `
 <section class="section-pad afiches" aria-labelledby="af-title"><div class="proto-container">
   <div class="af-head"><h1 class="display" id="af-title">MENÚ TANGO</h1>
     <div class="af-head-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · RESERVA PREVIA</span></div>
   </div>
   <figure class="af-photo"><img src="../assets/sushi.jpg" alt="Presentación gastronómica SushiClub" width="1400" height="1000">
     <figcaption>Una noche para disfrutar sin apuro.</figcaption></figure>
   <p class="lead af-lead">Cinco momentos, cada uno con su propio protagonismo.</p>
   <div class="af-posters">${parts}</div>
   <p class="note af-note">${note}</p>
 </div></section>`;
}
function recorrido(){
 const nav=courses.map((c,i)=>'<a href="#rc-part-'+i+'" data-rc-link="'+i+'"'+(i===0?' aria-current="location"':'')+'>'+
  '<span>'+escapeHTML(c.name)+'</span><span aria-hidden="true">↗</span></a>').join('');
 const sections=courses.map((c,i)=>'<article class="rc-course" id="rc-part-'+i+'" data-rc-part="'+i+'">'+
  '<h2>'+escapeHTML(c.name)+'</h2>'+
  (c.choice?'<span class="choice">'+escapeHTML(c.choice)+'</span>':'')+
  '<div class="rc-dishes">'+itemsHTML(c)+'</div></article>').join('');
 return `
  <section class="section-pad recorrido" aria-labelledby="rc-title"><div class="proto-container">
    <div class="rc-intro"><h1 class="display" id="rc-title">MENÚ TANGO</h1>
       <div class="rc-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · RESERVA PREVIA</span></div>
    </div>
    <div class="rc-layout">
      <aside class="rc-sidebar"><div class="rc-sticky">
         <nav class="rc-links" aria-label="Ir a cada parte del Menú Tango">${nav}</nav>
         <p class="lead">Elegí qué momento explorar o recorré el menú con el scroll.</p>
      </div></aside>
      <div class="rc-body">${sections}</div>
    </div>
    <p class="note rc-note">${note}</p>
  </div></section>`;
}
const variants=[comanda,afiches,recorrido];
const stage=document.getElementById('stage');
let routeScrollListener=null;
function syncRecorrido(){
 const sections=[...stage.querySelectorAll('[data-rc-part]')];
 if(!sections.length)return;
 const threshold=innerHeight*.40;
 let active=0;
 for(let i=0;i<sections.length;i++){
  if(sections[i].getBoundingClientRect().top<=threshold)active=i;
 }
 stage.querySelectorAll('[data-rc-link]').forEach(link=>{
  if(Number(link.dataset.rcLink)===active)link.setAttribute('aria-current','location');
  else link.removeAttribute('aria-current');
 });
}
function initRecorrido(){
 if(routeScrollListener){
  window.removeEventListener('scroll',routeScrollListener);
  routeScrollListener=null;
 }
 if(!stage.querySelector('.rc-links'))return;
 routeScrollListener=()=>syncRecorrido();
 window.addEventListener('scroll',routeScrollListener,{passive:true});
 syncRecorrido();
}
stage.addEventListener('click',event=>{
 const link=event.target.closest('.rc-links a');
 if(!link)return;
 const index=Number(link.dataset.rcLink);
 const part=stage.querySelector('[data-rc-part="'+index+'"]');
 if(!part)return;
 event.preventDefault();
 const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
 part.scrollIntoView({block:'start',behavior:reduced?'instant':'smooth'});
 stage.querySelectorAll('[data-rc-link]').forEach(a=>{
  if(Number(a.dataset.rcLink)===index)a.setAttribute('aria-current','location');
  else a.removeAttribute('aria-current');
 });
});
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); initRecorrido(); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize',()=>{moveHighlight();syncRecorrido();});
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
