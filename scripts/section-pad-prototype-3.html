<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Menú Tango · Tercera ronda de prototipos</title>
<style>
@font-face{font-family:Inter;src:url("../assets/fonts/inter-latin-variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#0a0a0a;--ink:#f4f4f3;--muted:#c5c7c9;--blue:#0d66ee;--surface:#191b1e;--pad:clamp(20px,4.8vw,85px);font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);min-width:320px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
[hidden]{display:none!important}
img{display:block;width:100%;height:100%;object-fit:cover}
figure{margin:0}
.mast{padding:29px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:90px}
.mast__brand{font-size:18px;font-weight:800;letter-spacing:-.065em}
.mast__label{font-size:13px;color:var(--muted)}
.stage{min-height:84svh}
.section-pad{padding:clamp(85px,10vw,165px) var(--pad) clamp(145px,12vw,200px);background:var(--bg)}
.display{font-weight:790;font-size:clamp(68px,10.5vw,165px);line-height:.87;letter-spacing:-.088em;margin:0}
.display--small{font-size:clamp(62px,7.7vw,115px)}
.lead{font-size:clamp(17px,1.7vw,23px);line-height:1.45;max-width:42ch;color:#e6e7e8;margin:0}
.price{font-weight:760;letter-spacing:-.07em;line-height:1;font-size:clamp(55px,7vw,105px);margin:0}
.price-label{font-size:13px;font-weight:650;color:var(--muted);line-height:1.5}
.note{font-size:13px;line-height:1.55;color:var(--muted);max-width:70ch}
.course-title{font-weight:760;font-size:clamp(33px,3.7vw,61px);letter-spacing:-.067em;line-height:1.08;margin:0}
.choice{font-size:13px;font-weight:650;color:#d5d7da}
.dish{font-size:clamp(17px,1.5vw,22px);line-height:1.5;margin:0}
.dish small{display:inline-block;margin-left:10px;font-size:14px;color:#b7bbc0}
.continuation{padding:50px var(--pad) 130px;color:#bec0c2;font-size:14px}
.continuation strong{color:#fff;font-weight:700}
.proto-container{max-width:1620px;margin-inline:auto}
/* Round three: signage, asymmetrical photo mosaic, horizontal physical cards. */
.cartelera .ct-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:clamp(30px,5vw,95px);margin-bottom:clamp(90px,10vw,150px)}
.cartelera .ct-head h1{font-size:clamp(82px,11vw,170px)}
.cartelera .ct-head .lead{margin-top:28px}
.cartelera .ct-price{text-align:right}
.cartelera .ct-price .price{font-size:clamp(58px,6.1vw,96px)}
.cartelera .ct-price .price-label{display:block;margin-top:15px}
.cartelera .ct-list{display:grid;gap:10px}
.cartelera .ct-row{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr);gap:clamp(30px,7vw,130px);align-items:start;padding:clamp(32px,4.5vw,68px);background:#161719}
.cartelera .ct-row:nth-child(even){background:#202124}
.cartelera .ct-row h2{font-size:clamp(42px,5.4vw,88px);font-weight:800;line-height:1.02;letter-spacing:-.072em;margin:0}
.cartelera .ct-row h2 span{display:block;margin-top:17px;font-size:14px;font-weight:550;letter-spacing:0;color:#c5c7ca}
.cartelera .ct-dishes{display:grid;gap:clamp(11px,1.6vw,25px);padding-top:6px}
.cartelera .ct-dishes .dish{font-size:clamp(18px,1.7vw,26px);line-height:1.36}
.cartelera .ct-note{margin-top:58px}
/* Mosaico: photography anchors a deliberately unequal gallery of dishes. */
.mosaico{padding-top:90px}
.mosaico .mo-head{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:clamp(45px,6vw,90px)}
.mosaico .mo-head h1{font-size:clamp(75px,9vw,137px)}
.mosaico .mo-price{text-align:right;flex-shrink:0}
.mosaico .mo-price .price{font-size:clamp(55px,5.5vw,85px)}
.mosaico .mo-price .price-label{display:block;margin-top:12px}
.mosaico .mo-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(225px,auto) minmax(265px,auto) minmax(260px,auto) auto;gap:clamp(10px,1.35vw,24px)}
.mosaico .mo-image{grid-column:1/span 7;grid-row:1/span 2;position:relative;overflow:hidden;background:#171819;min-height:550px}
.mosaico .mo-image img{object-position:49% 46%}
.mosaico .mo-image figcaption{position:absolute;left:clamp(20px,3vw,50px);bottom:clamp(20px,3vw,50px);font-size:16px;font-weight:680;padding:13px 16px;background:#0a0a0a;color:#fff}
.mosaico .mo-card{padding:clamp(24px,2.8vw,52px);background:#191a1d;min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.mosaico .mo-card:nth-of-type(even){background:#222428}
.mosaico .mo-card--appetizer{grid-column:8/-1;grid-row:1}
.mosaico .mo-card--entrada{grid-column:8/-1;grid-row:2}
.mosaico .mo-card--principal{grid-column:1/span 7;grid-row:3}
.mosaico .mo-card--postre{grid-column:8/-1;grid-row:3}
.mosaico .mo-card--bebidas{grid-column:1/-1;grid-row:4;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
.mosaico .mo-card h2{font-size:clamp(32px,3.5vw,57px);font-weight:760;letter-spacing:-.065em;line-height:1.02;margin:0 0 20px}
.mosaico .mo-card .choice{display:block;margin:-9px 0 18px}
.mosaico .mo-card .dish{font-size:clamp(17px,1.4vw,21px);line-height:1.42}
.mosaico .mo-card .dish small{font-size:13px;display:inline-block;margin-left:8px}
.mosaico .mo-card .mo-items{display:grid;gap:14px}
.mosaico .mo-note{margin-top:60px}
/* Cinta: horizontal continuous-scroll menu with navigable next/previous. */
.cinta{padding-top:105px}
.cinta .ci-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:30px;margin-bottom:35px}
.cinta .ci-header h1{font-size:clamp(77px,10.1vw,155px)}
.cinta .ci-head-price{text-align:right}
.cinta .ci-head-price .price{font-size:clamp(57px,6vw,93px)}
.cinta .ci-head-price .price-label{display:block;margin-top:13px}
.cinta .ci-description{margin-bottom:clamp(55px,6vw,100px)}
.cinta .ci-control{display:flex;align-items:center;gap:16px;margin-bottom:25px}
.cinta .ci-indicator{flex:1;color:#e0e1e3;font-size:16px;font-weight:620;letter-spacing:-.02em}
.cinta .ci-nav{display:flex;gap:10px}
.cinta .ci-nav button{display:grid;place-items:center;width:54px;height:54px;background:#232427;color:#f5f5f5;border:0;font-size:25px;border-radius:0}
.cinta .ci-nav button:hover:not(:disabled){background:var(--blue)}
.cinta .ci-nav button:disabled{opacity:.38;cursor:not-allowed}
.cinta .ci-viewport{overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-inline:contain;scrollbar-width:none;scroll-behavior:smooth;padding-bottom:5px}
.cinta .ci-viewport::-webkit-scrollbar{display:none}
.cinta .ci-track{display:flex;gap:clamp(13px,2vw,32px);width:max-content;max-width:none}
.cinta .ci-track::after{content:"";flex:0 0 var(--ci-tail,0px)}
.cinta .ci-card{width:min(670px,calc(100vw - 2 * var(--pad)));min-height:clamp(510px,58svh,720px);padding:clamp(35px,4vw,75px);background:#1b1c1f;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;outline-offset:3px}
.cinta .ci-card:nth-child(even){background:#232528}
.cinta .ci-card h2{font-size:clamp(54px,6vw,94px);letter-spacing:-.075em;line-height:1.02;margin:0;font-weight:770}
.cinta .ci-card .choice{display:block;margin-top:18px;font-size:15px}
.cinta .ci-card .ci-items{display:grid;gap:21px;margin-top:70px}
.cinta .ci-card .dish{font-size:clamp(20px,2vw,28px);line-height:1.38}
.cinta .ci-card .dish small{font-size:15px;margin-left:8px}
.cinta .ci-card--appetizer{position:relative;overflow:hidden;background:#161719}
.cinta .ci-card--appetizer::before{content:"";position:absolute;inset:0;background:url("../assets/sushi.jpg") 55% 50%/cover no-repeat;opacity:.36;pointer-events:none}
.cinta .ci-card--appetizer>*{position:relative}
.cinta .ci-footnote{margin-top:45px}
@media(max-width:960px){
 .mosaico .mo-grid{grid-template-rows:repeat(3,auto)}
 .mosaico .mo-image{grid-column:1/span 7;grid-row:1/span 2;min-height:470px}
 .mosaico .mo-card--appetizer{grid-column:8/-1;grid-row:1}
 .mosaico .mo-card--entrada{grid-column:8/-1;grid-row:2}
 .mosaico .mo-card--principal{grid-column:1/span 7;grid-row:3}
 .mosaico .mo-card--postre{grid-column:8/-1;grid-row:3}
 .mosaico .mo-card--bebidas{grid-column:1/-1;grid-row:4}
 .cinta .ci-card{width:min(650px,calc(100vw - 2 * var(--pad)))}
}
@media(max-width:760px){
 .cartelera .ct-head,.mosaico .mo-head,.cinta .ci-header{display:block;margin-bottom:65px}
 .cartelera .ct-head h1,.mosaico .mo-head h1,.cinta .ci-header h1{font-size:clamp(68px,15vw,105px)}
 .cartelera .ct-price,.mosaico .mo-price,.cinta .ci-head-price{text-align:left;margin-top:40px}
 .cartelera .ct-row{display:block;padding:35px 27px}
 .cartelera .ct-row h2{font-size:clamp(42px,9vw,65px);margin-bottom:26px}
 .cartelera .ct-dishes .dish{font-size:18px}
 .mosaico .mo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;gap:12px}
 .mosaico .mo-image{grid-column:1/-1;grid-row:auto;min-height:0;height:38svh}
 .mosaico .mo-card--appetizer,.mosaico .mo-card--entrada,.mosaico .mo-card--principal,.mosaico .mo-card--postre{grid-column:auto;grid-row:auto}
 .mosaico .mo-card--principal{grid-column:1/-1}
 .mosaico .mo-card--bebidas{grid-column:1/-1;grid-row:auto;display:block}
 .mosaico .mo-card{padding:27px 24px}
 .mosaico .mo-card h2{font-size:clamp(28px,6vw,42px)}
 .mosaico .mo-card .dish{font-size:17px}
 .mosaico .mo-image figcaption{font-size:13px}
 .cinta .ci-card{width:calc(100vw - 2 * var(--pad));min-height:500px;padding:35px 27px}
 .cinta .ci-card h2{font-size:clamp(50px,12vw,76px)}
 .cinta .ci-card .dish{font-size:20px}
 .cinta .ci-nav button{width:48px;height:48px}
}
@media(max-width:420px){
 .mosaico .mo-grid{grid-template-columns:1fr}
 .mosaico .mo-card--appetizer,.mosaico .mo-card--entrada,.mosaico .mo-card--principal,.mosaico .mo-card--postre{grid-column:1/-1}
 .mosaico .mo-image{height:34svh}
 .cinta .ci-card{min-height:470px}
 .cinta .ci-card h2{font-size:clamp(43px,10.5vw,66px)}
 .cinta .ci-card .dish{font-size:18px}
 .cinta .ci-card .dish small{display:block;margin-left:0}
}
@media(prefers-reduced-motion:reduce){.cinta .ci-viewport{scroll-behavior:auto}}
/* Picker: unchanged Emil Kowalski prototype harness chrome. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: /* taste-skill-ignore: Emil's mandatory picker chrome, not part of the menu design */
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<header class="mast">
  <span class="mast__brand">SUSHICLUB <span style="font-weight:450">/ NOCHE DE TANGO</span></span>
  <span class="mast__label">MENÚ TANGO · RONDA 3</span>
</header>
<main id="stage" class="stage" aria-live="polite"></main>
<footer class="continuation"><div class="proto-container">La experiencia continúa con <strong>reservas anticipadas</strong> en los salones adheridos.</div></footer>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Cartelera</button>
  <button class="proto-picker-item">Mosaico</button>
  <button class="proto-picker-item">Cinta</button>
</nav>
<script>

const courses = [
  {name:"Appetizer",choice:"",items:[["Appetizer del día",""]]},
  {name:"Entrada",choice:"A elección",items:[["Pink Floyd","3 unidades"],["Dupla Arrolladito Vegan","2 unidades"]]},
  {name:"Principal",choice:"A elección",items:[["Wok Langostinos",""],["Sorrentinos Back",""],["Roll&Roll","15 piezas"],["Bio Veggie","15 piezas"]]},
  {name:"Postre",choice:"",items:[["Flan de chocolate blanco",""]]},
  {name:"Bebidas",choice:"",items:[["Copa de vino Trapiche Malbec o Chardonnay, o gaseosa.",""],["Más agua con o sin gas, agua saborizada o gaseosa.",""]]}
];
const note = "ENTRADA Y PRINCIPAL A ELECCIÓN POR PERSONA. LA DISPONIBILIDAD DE LOS PRODUCTOS ESTÁ SUJETA AL LOCAL ADHERIDO.";
function escapeHTML(str){return str.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function itemsHTML(course){return course.items.map(([name,amount]) =>
  '<p class="dish">'+escapeHTML(name)+(amount?' <small>'+escapeHTML(amount)+'</small>':'')+'</p>'
).join('');}

function cartelera(){
  const rows=courses.map(course=>'<article class="ct-row">'+
    '<h2>'+escapeHTML(course.name)+(course.choice?'<span>'+escapeHTML(course.choice)+'</span>':'')+'</h2>'+
    '<div class="ct-dishes">'+itemsHTML(course)+'</div></article>').join('');
  return `
  <section class="section-pad cartelera" aria-labelledby="ct-title"><div class="proto-container">
    <div class="ct-head"><div>
      <h1 class="display" id="ct-title">MENÚ<br>TANGO</h1>
      <p class="lead">Cinco momentos. Todo en una misma carta.</p></div>
      <div class="ct-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · RESERVA PREVIA</span></div>
    </div>
    <div class="ct-list">${rows}</div>
    <p class="note ct-note">${note}</p>
  </div></section>`;
}
function mosaico(){
  const layouts=['appetizer','entrada','principal','postre','bebidas'];
  const tiles=courses.map((c,i)=>'<article class="mo-card mo-card--'+layouts[i]+'">'+
    '<div><h2>'+escapeHTML(c.name)+'</h2>'+
    (c.choice?'<span class="choice">'+escapeHTML(c.choice)+'</span>':'')+'</div>'+
    '<div class="mo-items">'+itemsHTML(c)+'</div></article>').join('');
  return `
  <section class="section-pad mosaico" aria-labelledby="mo-title"><div class="proto-container">
    <div class="mo-head">
      <h1 class="display" id="mo-title">MENÚ TANGO</h1>
      <div class="mo-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · CON RESERVA PREVIA</span></div>
    </div>
    <div class="mo-grid">
      <figure class="mo-image"><img src="../assets/sushi.jpg" width="1400" height="1000" alt="Selección gastronómica de SushiClub"><figcaption>Una noche para disfrutar sin apuro.</figcaption></figure>
      ${tiles}
    </div>
    <p class="note mo-note">${note}</p>
  </div></section>`;
}
function cinta(){
  const slides=courses.map((c,i)=>'<article class="ci-card ci-card--'+c.name.toLowerCase()+'" tabindex="0" aria-label="'+escapeHTML(c.name)+'">'+
   '<div><h2>'+escapeHTML(c.name)+'</h2>'+
   (c.choice?'<span class="choice">'+escapeHTML(c.choice)+'</span>':'')+'</div>'+
   '<div class="ci-items">'+itemsHTML(c)+'</div></article>').join('');
  return `
  <section class="section-pad cinta" aria-labelledby="ci-title"><div class="proto-container">
    <div class="ci-header"><h1 class="display" id="ci-title">MENÚ TANGO</h1>
      <div class="ci-head-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · RESERVA PREVIA</span></div>
    </div>
    <p class="lead ci-description">Recorré cada momento a tu ritmo. Deslizá o utilizá las flechas.</p>
    <div class="ci-control">
      <span class="ci-indicator" aria-live="polite">Appetizer</span>
      <div class="ci-nav">
        <button type="button" data-ci-step="-1" aria-label="Menú anterior" disabled>←</button>
        <button type="button" data-ci-step="1" aria-label="Menú siguiente">→</button>
      </div>
    </div>
    <div class="ci-viewport" tabindex="0" role="region" aria-roledescription="Carrusel" aria-label="Los cinco momentos del Menú Tango">
      <div class="ci-track">${slides}</div>
    </div>
    <p class="note ci-footnote">${note}</p>
  </div></section>`;
}
const variants=[cartelera,mosaico,cinta];
const stage=document.getElementById('stage');
function cintaPosition(){
  const viewport=stage.querySelector('.ci-viewport');
  if(!viewport)return null;
  const cards=[...viewport.querySelectorAll('.ci-card')];
  const stride=cards.length>1?cards[1].offsetLeft-cards[0].offsetLeft:cards[0].offsetWidth;
  viewport.style.setProperty('--ci-tail',Math.max(0,viewport.clientWidth-cards[0].offsetWidth)+'px');
  const index=Math.min(cards.length-1,Math.max(0,Math.round(viewport.scrollLeft / stride)));
  return {viewport,cards,stride,index};
}
function syncCinta(){
  const state=cintaPosition();
  if(!state)return;
  const {index,cards}=state;
  const label=stage.querySelector('.ci-indicator');
  if(label)label.textContent=courses[index].name;
  const prev=stage.querySelector('[data-ci-step="-1"]');
  const next=stage.querySelector('[data-ci-step="1"]');
  if(prev)prev.disabled=index===0;
  if(next)next.disabled=index===cards.length-1;
}
function goCinta(step){
  const state=cintaPosition();
  if(!state)return;
  const target=Math.min(state.cards.length-1,Math.max(0,state.index+step));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  state.viewport.scrollTo({left:state.stride*target,behavior:reduce?'instant':'smooth'});
}
stage.addEventListener('click',e=>{
  const button=e.target.closest('[data-ci-step]');
  if(button)goCinta(Number(button.dataset.ciStep));
});
stage.addEventListener('scroll',e=>{
  if(e.target.matches?.('.ci-viewport'))syncCinta();
},true);
stage.addEventListener('keydown',e=>{
  if(!e.target.closest('.cinta'))return;
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight')return;
  e.preventDefault();e.stopPropagation();
  goCinta(e.key==='ArrowRight'?1:-1);
});
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); syncCinta(); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize',()=>{moveHighlight();syncCinta();});
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
