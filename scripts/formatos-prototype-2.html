/* RONDA DOS — three directions, one native design system; no production imports */

<script>
const variants=[
 ()=>document.getElementById('template-programa').innerHTML,
 ()=>document.getElementById('template-umbral').innerHTML,
 ()=>document.getElementById('template-secuencia').innerHTML
];
const mainStage=document.getElementById('stage');
mainStage.addEventListener('input',function(event){
 const target=event.target;
 if(!target.matches('[data-compare]'))return;
 const compare=target.closest('.compare');
 if(!compare)return;
 const amount=Number(target.value);
 compare.style.setProperty('--split',amount+'%');
 target.setAttribute('aria-valuetext',amount===50?'Ambos formatos visibles por igual':amount>50?'Predomina la imagen de Minimal':'Predomina la imagen de Essential');
});
function updateReel(windowEl){
 if(!windowEl)return;
 const reel=windowEl.closest('.reel');
 if(!reel)return;
 const index=Math.max(0,Math.min(1,Math.round(windowEl.scrollLeft/Math.max(1,windowEl.clientWidth))));
 const counter=reel.querySelector('[data-reel-counter]');
 if(counter)counter.textContent=index?'02 / 02':'01 / 02';
 reel.querySelectorAll('[data-reel-to]').forEach(btn=>btn.setAttribute('aria-current',String(Number(btn.dataset.reelTo)===index)));
 const previous=reel.querySelector('[data-reel-prev]');
 const next=reel.querySelector('[data-reel-next]');
 if(previous)previous.disabled=index===0;
 if(next)next.disabled=index===1;
}
mainStage.addEventListener('click',function(event){
 const control=event.target.closest('[data-reel-prev],[data-reel-next],[data-reel-to]');
 if(!control)return;
 const reel=control.closest('.reel');
 const view=reel&&reel.querySelector('[data-reel-window]');
 if(!view)return;
 const index=Math.max(0,Math.min(1,Math.round(view.scrollLeft/Math.max(1,view.clientWidth))));
 const destination=control.hasAttribute('data-reel-prev')?Math.max(0,index-1):control.hasAttribute('data-reel-next')?Math.min(1,index+1):Number(control.dataset.reelTo);
 view.scrollTo({left:destination*view.clientWidth,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)updateReel(view);
});
mainStage.addEventListener('scroll',function(event){
 const target=event.target;
 if(!target.matches||!target.matches('[data-reel-window]'))return;
 if(target._reelFrame)cancelAnimationFrame(target._reelFrame);
 target._reelFrame=requestAnimationFrame(()=>updateReel(target));
},true);
// Picker wiring from PICKER.md (standalone reference, highlight translation string uses concatenation).
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script></body></html>
