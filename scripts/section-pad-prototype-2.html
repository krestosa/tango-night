<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Menú Tango · Segunda ronda de prototipos</title>
<style>
@font-face{font-family:Inter;src:url("../assets/fonts/inter-latin-variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#0a0a0a;--ink:#f4f4f3;--muted:#c5c7c9;--blue:#0d66ee;--surface:#191b1e;--pad:clamp(20px,4.8vw,85px);font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);min-width:320px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
[hidden]{display:none!important}
img{display:block;width:100%;height:100%;object-fit:cover}
figure{margin:0}
.mast{padding:29px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:90px}
.mast__brand{font-size:18px;font-weight:800;letter-spacing:-.065em}
.mast__label{font-size:13px;color:var(--muted)}
.stage{min-height:84svh}
.section-pad{padding:clamp(85px,10vw,165px) var(--pad) clamp(145px,12vw,200px);background:var(--bg)}
.display{font-weight:790;font-size:clamp(68px,10.5vw,165px);line-height:.87;letter-spacing:-.088em;margin:0}
.display--small{font-size:clamp(62px,7.7vw,115px)}
.lead{font-size:clamp(17px,1.7vw,23px);line-height:1.45;max-width:42ch;color:#e6e7e8;margin:0}
.price{font-weight:760;letter-spacing:-.07em;line-height:1;font-size:clamp(55px,7vw,105px);margin:0}
.price-label{font-size:13px;font-weight:650;color:var(--muted);line-height:1.5}
.note{font-size:13px;line-height:1.55;color:var(--muted);max-width:70ch}
.course-title{font-weight:760;font-size:clamp(33px,3.7vw,61px);letter-spacing:-.067em;line-height:1.08;margin:0}
.choice{font-size:13px;font-weight:650;color:#d5d7da}
.dish{font-size:clamp(17px,1.5vw,22px);line-height:1.5;margin:0}
.dish small{display:inline-block;margin-left:10px;font-size:14px;color:#b7bbc0}
.continuation{padding:50px var(--pad) 130px;color:#bec0c2;font-size:14px}
.continuation strong{color:#fff;font-weight:700}
.proto-container{max-width:1620px;margin-inline:auto}
/* Round two: three genuinely different axes, all on #0a0a0a. */
/* Escalera — five consecutive acts with large alternating reading positions. */
.escalera .sc-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:30px;margin-bottom:clamp(75px,11vw,170px)}
.escalera .sc-intro .display{font-size:clamp(75px,10.8vw,160px)}
.escalera .sc-intro__copy{margin-top:28px}
.escalera .sc-price{text-align:right}
.escalera .sc-price .price{font-size:clamp(60px,6.5vw,95px)}
.escalera .sc-price .price-label{display:block;margin-top:15px}
.escalera .sc-flow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));row-gap:clamp(70px,10vw,155px)}
.escalera .sc-course{min-width:0}
.escalera .sc-course:nth-child(odd){grid-column:1 / span 7}
.escalera .sc-course:nth-child(even){grid-column:7 / -1}
.escalera .sc-course h2{font-size:clamp(54px,6.7vw,112px);line-height:.98;letter-spacing:-.075em;margin:0 0 27px;font-weight:770}
.escalera .sc-choice{display:block;color:#b6bac0;font-size:14px;margin-bottom:25px;font-weight:550}
.escalera .sc-dishes{display:grid;gap:17px}
.escalera .sc-note{margin-top:clamp(95px,10vw,150px)}
/* Vitrina — photographic panorama and compact five-column menu board. */
.vitrina{padding-top:90px}
.vitrina .vt-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:35px;padding-bottom:45px}
.vitrina .vt-heading h1{font-size:clamp(68px,8.8vw,135px)}
.vitrina .vt-price{text-align:right;flex:0 0 auto}
.vitrina .vt-price .price{font-size:clamp(54px,5.4vw,85px)}
.vitrina .vt-price .price-label{display:block;margin-top:14px}
.vitrina .vt-photo{height:clamp(340px,48svh,640px);overflow:hidden;background:#1a1a1a}
.vitrina .vt-photo img{object-fit:cover;object-position:52% 53%}
.vitrina .vt-caption{display:flex;align-items:center;justify-content:space-between;gap:25px;margin-top:20px;margin-bottom:clamp(65px,6vw,100px);font-size:15px;color:#dfe1e2}
.vitrina .vt-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;gap:clamp(18px,2.8vw,48px)}
.vitrina .vt-course{min-width:0}
.vitrina .vt-course h2{font-size:clamp(30px,2.8vw,48px);line-height:1.06;letter-spacing:-.06em;font-weight:780;margin:0 0 24px;overflow-wrap:normal}
.vitrina .vt-course .choice{display:block;margin:-12px 0 22px}
.vitrina .vt-options{display:grid;gap:20px}
.vitrina .vt-course .dish{font-size:clamp(16px,1.17vw,19px);line-height:1.45;overflow-wrap:break-word}
.vitrina .vt-course .dish small{margin-left:0;display:block}
.vitrina .vt-note{margin-top:85px}
/* Combinación — useful live menu assembly, explicitly not a reservation. */
.combinacion{padding-top:100px}
.combinacion .cb-head{max-width:1500px;margin-bottom:clamp(60px,7vw,115px)}
.combinacion .cb-head .display{font-size:clamp(74px,11vw,162px)}
.combinacion .cb-head .lead{margin-top:30px}
.combinacion .cb-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.85fr);gap:clamp(30px,5vw,90px);align-items:start}
.combinacion .cb-choices{display:grid;gap:45px}
.combinacion .cb-field{border:0;margin:0;padding:0;min-width:0}
.combinacion .cb-field legend{font-weight:760;font-size:clamp(28px,3vw,48px);letter-spacing:-.055em;margin-bottom:20px}
.combinacion .cb-options{display:grid;gap:7px}
.combinacion .cb-opt{display:grid;grid-template-columns:auto 1fr auto;gap:17px;align-items:center;min-height:73px;padding:17px 22px;background:#18191c;cursor:pointer}
.combinacion .cb-opt:hover{background:#222428}
.combinacion .cb-opt:has(input:checked){background:#1c2637;outline:2px solid var(--blue);outline-offset:-2px}
.combinacion .cb-opt input{accent-color:var(--blue);width:19px;height:19px;margin:0}
.combinacion .cb-opt span{font-size:clamp(17px,1.55vw,22px);font-weight:600;letter-spacing:-.035em;line-height:1.2}
.combinacion .cb-opt small{font-size:13px;color:#c3c6cb;text-align:right}
.combinacion .cb-constants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.combinacion .cb-constant{padding:25px 18px;background:#141517;min-width:0}
.combinacion .cb-constant strong{display:block;font-size:clamp(19px,1.6vw,26px);letter-spacing:-.045em;margin-bottom:13px}
.combinacion .cb-constant p{font-size:15px;line-height:1.55;color:#dedfe0;margin:0}
.combinacion .cb-preview{position:sticky;top:32px;background:#1b1c1f;padding:clamp(27px,3.4vw,60px);min-width:0}
.combinacion .cb-preview h2{font-size:clamp(36px,4vw,65px);letter-spacing:-.07em;line-height:1.04;margin:0 0 35px}
.combinacion .cb-preview-items{display:grid;gap:22px;margin:0}
.combinacion .cb-summary{display:grid;gap:6px}
.combinacion .cb-summary dt{font-size:14px;color:#cdd0d3}
.combinacion .cb-summary dd{margin:0;font-size:clamp(17px,1.5vw,21px);font-weight:650;line-height:1.38;overflow-wrap:anywhere}
.combinacion .cb-summary dd span{font-size:13px;font-weight:500;color:#b9bdc2}
.combinacion .cb-final-price{margin-top:42px;display:flex;flex-wrap:wrap;align-items:end;gap:12px;justify-content:space-between}
.combinacion .cb-final-price .price{font-size:clamp(47px,4.8vw,76px)}
.combinacion .cb-fine{font-size:13px;line-height:1.55;color:#c2c6ca;margin:24px 0 0}
.combinacion .cb-note{margin-top:56px}
@media(max-width:1050px){
 .vitrina .vt-board{grid-template-columns:repeat(3,minmax(0,1fr));gap:42px}
 .combinacion .cb-grid{grid-template-columns:minmax(0,1fr) minmax(310px,.86fr);gap:28px}
 .combinacion .cb-constants{grid-template-columns:1fr}
 .combinacion .cb-constant{padding:18px 24px}
}
@media(max-width:760px){
 .escalera .sc-intro,.vitrina .vt-heading{display:block;margin-bottom:65px}
 .escalera .sc-intro .display,.vitrina .vt-heading h1{font-size:clamp(67px,15.4vw,102px)}
 .escalera .sc-price,.vitrina .vt-price{text-align:left;margin-top:40px}
 .escalera .sc-flow{display:block}
 .escalera .sc-course:nth-child(n){grid-column:auto;width:100%;margin-bottom:74px}
 .escalera .sc-course:nth-child(even){padding-left:clamp(20px,7vw,55px)}
 .escalera .sc-course h2{font-size:clamp(48px,12vw,84px)}
 .escalera .sc-price .price{font-size:67px}
 .vitrina .vt-photo{height:36svh;min-height:240px}
 .vitrina .vt-caption{flex-wrap:wrap;margin-bottom:50px}
 .vitrina .vt-board{grid-template-columns:repeat(2,minmax(0,1fr));gap:45px 22px}
 .vitrina .vt-course h2{font-size:clamp(30px,7vw,42px)}
 .vitrina .vt-course .dish{font-size:16px}
 .combinacion .cb-grid{grid-template-columns:1fr;gap:60px}
 .combinacion .cb-head .display{font-size:clamp(69px,15vw,110px)}
 .combinacion .cb-preview{position:static}
 .combinacion .cb-constants{grid-template-columns:repeat(3,minmax(0,1fr))}
 .combinacion .cb-constant{padding:18px 13px}
}
@media(max-width:420px){
 .escalera .sc-intro .display,.vitrina .vt-heading h1{font-size:clamp(58px,14vw,75px)}
 .vitrina .vt-board{grid-template-columns:1fr;gap:33px}
 .vitrina .vt-course{padding-bottom:17px}
 .vitrina .vt-course h2{font-size:36px;margin-bottom:12px}
 .vitrina .vt-options{gap:12px}
 .vitrina .vt-course .dish{font-size:18px}
 .combinacion .cb-constants{grid-template-columns:1fr}
 .combinacion .cb-opt{grid-template-columns:auto 1fr}
 .combinacion .cb-opt small{grid-column:2;text-align:left}
 .combinacion .cb-preview{padding:26px 21px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* Picker: unchanged Emil Kowalski prototype harness chrome. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: /* taste-skill-ignore: Emil's mandatory picker chrome, not part of the menu design */
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<header class="mast">
  <span class="mast__brand">SUSHICLUB <span style="font-weight:450">/ NOCHE DE TANGO</span></span>
  <span class="mast__label">MENÚ TANGO · RONDA 2</span>
</header>
<main id="stage" class="stage" aria-live="polite"></main>
<footer class="continuation"><div class="proto-container">La experiencia continúa con <strong>reservas anticipadas</strong> en los salones adheridos.</div></footer>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Escalera</button>
  <button class="proto-picker-item">Vitrina</button>
  <button class="proto-picker-item">Combinación</button>
</nav>
<script>

const courses = [
  {name:"Appetizer",choice:"",items:[["Appetizer del día",""]]},
  {name:"Entrada",choice:"A elección",items:[["Pink Floyd","3 unidades"],["Dupla Arrolladito Vegan","2 unidades"]]},
  {name:"Principal",choice:"A elección",items:[["Wok Langostinos",""],["Sorrentinos Back",""],["Roll&Roll","15 piezas"],["Bio Veggie","15 piezas"]]},
  {name:"Postre",choice:"",items:[["Flan de chocolate blanco",""]]},
  {name:"Bebidas",choice:"",items:[["Copa de vino Trapiche Malbec o Chardonnay, o gaseosa.",""],["Más agua con o sin gas, agua saborizada o gaseosa.",""]]}
];
const note = "ENTRADA Y PRINCIPAL A ELECCIÓN POR PERSONA. LA DISPONIBILIDAD DE LOS PRODUCTOS ESTÁ SUJETA AL LOCAL ADHERIDO.";
function escapeHTML(str){return str.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function itemsHTML(course){return course.items.map(([name,amount]) =>
  '<p class="dish">'+escapeHTML(name)+(amount?' <small>'+escapeHTML(amount)+'</small>':'')+'</p>'
).join('');}

function escalera(){
  const acts=courses.map((c)=>'<article class="sc-course">'+
    '<h2>'+escapeHTML(c.name)+'</h2>'+
    (c.choice?'<span class="sc-choice">'+escapeHTML(c.choice)+'</span>':'')+
    '<div class="sc-dishes">'+itemsHTML(c)+'</div></article>').join('');
  return `
  <section class="section-pad escalera" aria-labelledby="sc-title"><div class="proto-container">
    <div class="sc-intro">
      <div><h1 class="display" id="sc-title">MENÚ<br>TANGO</h1>
        <p class="lead sc-intro__copy">Cinco momentos que marcan el ritmo de la noche.</p></div>
      <div class="sc-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · RESERVA PREVIA</span></div>
    </div>
    <div class="sc-flow">${acts}</div>
    <p class="note sc-note">${note}</p>
  </div></section>`;
}
function vitrina(){
  const groups=courses.map(c=>'<article class="vt-course"><h2>'+escapeHTML(c.name)+'</h2>'+
    (c.choice?'<span class="choice">'+escapeHTML(c.choice)+'</span>':'')+
    '<div class="vt-options">'+itemsHTML(c)+'</div></article>').join('');
  return `
  <section class="section-pad vitrina" aria-labelledby="vt-title"><div class="proto-container">
    <div class="vt-heading">
      <h1 class="display" id="vt-title">MENÚ TANGO</h1>
      <div class="vt-price"><p class="price">$79.000</p><span class="price-label">POR PERSONA · CON RESERVA PREVIA</span></div>
    </div>
    <figure class="vt-photo"><img src="../assets/sushi.jpg" alt="SushiClub: fotografía de las piezas de sushi" width="1400" height="1000"></figure>
    <div class="vt-caption"><span>Una noche para disfrutar sin apuro.</span><span>Cinco momentos · Noche de Tango</span></div>
    <div class="vt-board">${groups}</div>
    <p class="note vt-note">${note}</p>
  </div></section>`;
}
function menuRadioOptions(course,name){
  return course.items.map(([dish,qty],i)=>
    '<label class="cb-opt"><input type="radio" name="'+name+'" value="'+i+'"'+(i===0?' checked':'')+'>'+
    '<span>'+escapeHTML(dish)+'</span>'+
    (qty?'<small>'+escapeHTML(qty)+'</small>':'')+'</label>'
  ).join('');
}
function combinacion(){
  return `
  <section class="section-pad combinacion" aria-labelledby="cb-title"><div class="proto-container">
    <div class="cb-head">
      <h1 class="display" id="cb-title">MENÚ<br>TANGO</h1>
      <p class="lead">Elegí una entrada y un principal para ver tu combinación. El precio se mantiene.</p>
    </div>
    <div class="cb-grid">
      <div class="cb-choices">
        <fieldset class="cb-field"><legend>Elegí tu entrada</legend>
          <div class="cb-options">${menuRadioOptions(courses[1],'entrada')}</div>
        </fieldset>
        <fieldset class="cb-field"><legend>Elegí tu principal</legend>
          <div class="cb-options">${menuRadioOptions(courses[2],'principal')}</div>
        </fieldset>
        <div class="cb-constants">
          <div class="cb-constant"><strong>Appetizer</strong><p>Appetizer del día</p></div>
          <div class="cb-constant"><strong>Postre</strong><p>Flan de chocolate blanco</p></div>
          <div class="cb-constant"><strong>Bebidas</strong><p>Copa de vino Trapiche Malbec o Chardonnay, o gaseosa. Más agua con o sin gas, agua saborizada o gaseosa.</p></div>
        </div>
      </div>
      <aside class="cb-preview" aria-label="Vista previa de tu menú">
        <h2>Tu combinación.</h2>
        <dl class="cb-preview-items">
          <div class="cb-summary"><dt>Appetizer</dt><dd>Appetizer del día</dd></div>
          <div class="cb-summary"><dt>Entrada</dt><dd id="cb-entry-preview" aria-live="polite">Pink Floyd <span>· 3 unidades</span></dd></div>
          <div class="cb-summary"><dt>Principal</dt><dd id="cb-main-preview" aria-live="polite">Wok Langostinos</dd></div>
          <div class="cb-summary"><dt>Postre</dt><dd>Flan de chocolate blanco</dd></div>
          <div class="cb-summary"><dt>Bebidas</dt><dd>Copa de vino Trapiche Malbec o Chardonnay, o gaseosa. Más agua con o sin gas, agua saborizada o gaseosa.</dd></div>
        </dl>
        <div class="cb-final-price"><span class="price-label">MENÚ POR PERSONA</span><p class="price">$79.000</p></div>
        <p class="cb-fine">Vista previa informativa. No realiza pedidos ni confirma reservas.</p>
      </aside>
    </div>
    <p class="note cb-note">${note}</p>
  </div></section>`;
}
const variants = [escalera,vitrina,combinacion];
const stage = document.getElementById('stage');
stage.addEventListener('change',event=>{
  const radio=event.target.closest('.cb-opt input');
  if(!radio)return;
  const group=radio.name==='entrada'?courses[1]:courses[2];
  const target=stage.querySelector(radio.name==='entrada'?'#cb-entry-preview':'#cb-main-preview');
  const selected=group.items[Number(radio.value)];
  if(target&&selected)target.innerHTML=escapeHTML(selected[0])+(selected[1]?' <span>· '+escapeHTML(selected[1])+'</span>':'');
});
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
